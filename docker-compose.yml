services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bilibili
      POSTGRES_USER: bilibili
      POSTGRES_PASSWORD: bilibili-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilibili -d bilibili"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - work_cache:/tmp/dramawave-processor
      - storage_data:/var/lib/dramawave-processor/storage

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - work_cache:/tmp/dramawave-processor
      - storage_data:/var/lib/dramawave-processor/storage

volumes:
  # External: preserve pre-rename data (DB history + stored media).
  postgres_data:
    external: true
    name: bilibili-processor_postgres_data
  storage_data:
    external: true
    name: bilibili-processor_storage_data
  work_cache:
